aid: complir
name: Complir
description: >-
  Complir is the AI infrastructure for product compliance, described by the
  company as "Vanta for physical products." Its AI agents map product data,
  analyse compliance risks, generate audit-ready documentation, and track
  regulatory changes across every market a brand sells in - covering GPSR,
  ESPR, EPR, REACH, RoHS, PPWR, EUDR, CE/UKCA marking, Digital Product
  Passports and 100+ other frameworks across 40+ markets. The platform maps
  each SKU to its regulatory requirements, produces translations, labels,
  warnings, declarations of conformity and technical files, verifies marketing
  claims, and offers native Adobe Illustrator/InDesign plugins plus a natural
  language interface for querying compliance data. Founded in 2024 (Gustav
  Bang, Marc Kaa Brejner, Tine Kuhnel) and part of Y Combinator's Spring 2026
  batch, Complir monitors 100,000+ products for international retailers
  including Flying Tiger Copenhagen, Konges Sloejd, Matas and COOP.
